<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found | Career Tools IL</title>
  <meta name="description" content="That page is not on Career Tools IL. Back to the salary calculator and the freelance rate calculator." />
  <meta name="robots" content="noindex, follow" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="he_IL" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c6a56d'/%3E%3Cpath d='M8 22.5h7M8 16h12M8 9.5h16' fill='none' stroke='%2316130e' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <script>
  (function () {
    try {
      if (localStorage.getItem("ctil_lang") === "he") {
        document.documentElement.lang = "he";
        document.documentElement.dir = "rtl";
        document.documentElement.classList.add("i18n-pending");
      }
    } catch (e) {}
  })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
  <style>
    :root { --font: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    html[lang="he"] { --font: Heebo, "Segoe UI", "Arial Hebrew", Arial, sans-serif; }
    html.i18n-pending body { visibility: hidden; }
    body {
      font-family: var(--font);
      background: #101114;
      color: #f2f3f5;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
      line-height: 1.55;
    }
    h1 { font-weight: 600; font-size: 1.6rem; letter-spacing: -.02em; margin-bottom: 8px; }
    html[lang="he"] h1 { letter-spacing: 0; }
    p { color: #9aa1ab; margin: 0 0 16px; }
    a { color: #d6c4a3; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .links { display: flex; flex-wrap: wrap; gap: 12px 16px; justify-content: center; }
    .lang { margin-top: 22px; }
    .lang button {
      background: none; border: 0; color: #9aa1ab; font-family: inherit;
      font-size: .78rem; font-weight: 600; letter-spacing: .06em; cursor: pointer; padding: 6px 4px;
    }
    .lang button.on { color: #f2f3f5; }
    .sep { color: #3a3f48; }
  </style>
</head>
<body>
  <!-- Path audit: in-page links stay relative (./). If the miss is nested under /shoot/, script rewrites them to that prefix. -->
  <div>
    <h1 data-i18n="h1">Page not found</h1>
    <p data-i18n="p">That link is not on Career Tools IL.</p>
    <div class="links">
      <a data-root href="./" data-i18n="home">Back home</a>
      <a data-root="why/" href="./why/" data-i18n="why">Why us</a>
      <a data-root="why-us/" href="./why-us/" data-i18n="fit">Why these tools</a>
      <a data-root="osek-patur-vs-murshah/" href="./osek-patur-vs-murshah/" data-i18n="osek">Osek guide</a>
      <a data-root="salary-negotiator/" href="./salary-negotiator/" data-i18n="sal">Salary calculator</a>
      <a data-root="freelance-rate/" href="./freelance-rate/" data-i18n="fr">Freelance rate</a>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <span class="sep" aria-hidden="true">|</span>
      <button type="button" data-lang="he" aria-pressed="false">HE</button>
    </div>
  </div>
  <script>
  (function () {
    var path = location.pathname || "";
    var marker = "/shoot/";
    var at = path.indexOf(marker);
    var base = "./";
    if (at >= 0) base = path.slice(0, at + marker.length);
    else if (/\/404\.html$/.test(path)) base = path.replace(/404\.html$/, "");
    document.querySelectorAll("[data-root]").forEach(function (a) {
      a.setAttribute("href", base + (a.getAttribute("data-root") || ""));
    });

    var I18N = {
      en: {
        title: "Page not found | Career Tools IL",
        h1: "Page not found",
        p: "That link is not on Career Tools IL.",
        home: "Back home",
        why: "Why us",
        fit: "Why these tools",
        osek: "Osek guide",
        sal: "Salary calculator",
        fr: "Freelance rate"
      },
      he: {
        title: "הדף לא נמצא | Career Tools IL",
        h1: "הדף לא נמצא",
        p: "הקישור לא קיים ב־Career Tools IL.",
        home: "חזרה לדף הבית",
        why: "למה אנחנו",
        fit: "למה הכלים",
        osek: "מדריך עוסק",
        sal: "מחשבון שכר",
        fr: "תעריף פרילנס"
      }
    };
    function applyLang(lang) {
      try {
        if (lang !== "he") lang = "en";
        var d = I18N[lang];
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
        try { localStorage.setItem("ctil_lang", lang); } catch (err) {}
        document.title = d.title;
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var k = el.getAttribute("data-i18n");
          if (d[k] != null) el.textContent = d[k];
        });
        var loc = document.querySelector('meta[property="og:locale"]');
        var alt = document.querySelector('meta[property="og:locale:alternate"]');
        if (loc) loc.setAttribute("content", lang === "he" ? "he_IL" : "en_US");
        if (alt) alt.setAttribute("content", lang === "he" ? "en_US" : "he_IL");
        document.querySelectorAll("[data-lang]").forEach(function (b) {
          var on = b.getAttribute("data-lang") === lang;
          b.setAttribute("aria-pressed", on ? "true" : "false");
          b.classList.toggle("on", on);
        });
      } finally {
        document.documentElement.classList.remove("i18n-pending");
      }
    }
    var stored = "en";
    try { stored = localStorage.getItem("ctil_lang") === "he" ? "he" : "en"; } catch (e) {}
    applyLang(stored);
    document.querySelectorAll("[data-lang]").forEach(function (btn) {
      btn.addEventListener("click", function () { applyLang(btn.getAttribute("data-lang")); });
    });
  })();
  </script>
  <noscript><style>html.i18n-pending body { visibility: visible; }</style></noscript>
</body>
</html>
