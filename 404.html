<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="description" content="הדף שחיפשתם לא נמצא ב־Career Tools IL. חזרה למחשבון השכר ולמחשבון תעריף הפרילנס." />
  <meta name="robots" content="noindex, follow" />
  <meta property="og:locale" content="he_IL" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233dd6c6'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='13' font-family='Arial' font-weight='700' fill='%230b1220'%3ECT%3C/text%3E%3C/svg%3E" />
  <style>
    body {
      font-family: "Heebo", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
      background: #0b1220;
      color: #e8eef6;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
      line-height: 1.6;
    }
    a { color: #3dd6c6; }
    .links { display: flex; flex-wrap: wrap; gap: 12px 16px; justify-content: center; margin-top: 12px; }
  </style>
</head>
<body>
  <!-- Path audit: in-page links stay relative (./). If the miss is nested under /shoot/, script rewrites them to that prefix. -->
  <div>
    <h1>הדף לא נמצא</h1>
    <p>הקישור לא קיים ב־Career Tools IL.</p>
    <div class="links">
      <a data-root href="./">חזרה לדף הבית</a>
      <a data-root="salary-negotiator/" href="./salary-negotiator/">מחשבון שכר</a>
      <a data-root="freelance-rate/" href="./freelance-rate/">תעריף פרילנס</a>
    </div>
  </div>
  <script>
  (function () {
    var path = location.pathname || "";
    var marker = "/shoot/";
    var at = path.indexOf(marker);
    var base = "./";
    if (at >= 0) base = path.slice(0, at + marker.length);
    else if (/\/404\.html$/.test(path)) base = path.replace(/404\.html$/, "");
    document.querySelectorAll("[data-root]").forEach(function (a) {
      a.setAttribute("href", base + (a.getAttribute("data-root") || ""));
    });
  })();
  </script>
</body>
</html>
